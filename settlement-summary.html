<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월별 정산 합산조회</title>
<link rel="stylesheet" href="settlement-summary.css">
</head>

<body>
<div class="wrap">

  <div class="header">
    <h1>월별 정산 합산조회</h1>
    <p>각 월별 백화점수수료, 본사관리비, 로열티, 원재료비, 경비, 최종지급액을 합산 조회합니다.</p>
  </div>

  <div class="card">
    <div class="search-row">
      <div>
        <label>조회 시작월</label>
        <input id="startMonth" type="month">
      </div>

      <div>
        <label>조회 종료월</label>
        <input id="endMonth" type="month">
      </div>

      <button onclick="loadMonthlySummary()">조회하기</button>
    </div>
  </div>

  <div class="card">
    <h2>월별 합산내역</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>정산월</th>
            <th>총매출</th>
            <th>백화점수수료</th>
            <th>본사관리비</th>
            <th>국가유산진흥원 로열티</th>
            <th>원재료비</th>
            <th>경비/공과금</th>
            <th>공제합계</th>
            <th>최종지급액</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td colspan="9">조회된 자료가 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="msg" class="msg"></div>

</div>

<script src="settlement-summary.js"></script>
</body>
</html>
