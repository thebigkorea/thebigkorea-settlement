<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>점포별 정산 관리</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;
  background:#f5efe6;
  color:#241812;
}

.wrap{
  max-width:1500px;
  margin:0 auto;
  padding:20px;
}

.header{
  background:linear-gradient(135deg,#3a2517,#8b5b2b);
  color:#fff;
  padding:28px;
  border-radius:24px;
  margin-bottom:18px;
}

.header h1{
  margin:0 0 8px;
  font-size:32px;
}

.header p{
  margin:0;
  opacity:.85;
}

.filters{
  display:grid;
  grid-template-columns:1fr 180px 180px;
  gap:12px;
  margin-bottom:16px;
}

input,select{
  width:100%;
  border:1px solid #d8c8b4;
  border-radius:12px;
  padding:10px;
  font-size:14px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:16px;
}

.box{
  background:#fffaf2;
  border:1px solid rgba(70,45,25,.14);
  border-radius:18px;
  padding:18px;
}

.box span{
  display:block;
  font-size:13px;
  font-weight:900;
  color:#7b6a5c;
  margin-bottom:8px;
}

.box strong{
  font-size:22px;
}

.table-wrap{
  overflow:auto;
  background:#fffaf2;
  border:1px solid rgba(70,45,25,.14);
  border-radius:22px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1700px;
}

th{
  background:#f1e7d8;
  color:#3a2517;
  padding:13px;
  font-size:13px;
  text-align:center;
  position:sticky;
  top:0;
}

td{
  padding:10px;
  border-top:1px solid #eadfce;
  font-size:13px;
  vertical-align:middle;
  text-align:right;
}

td.left{
  text-align:left;
}

.status-box{
  display:flex;
  gap:6px;
  align-items:center;
}

.status-box select{
  min-width:95px;
  padding:8px;
}

.btn{
  display:inline-block;
  border:0;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  background:#8b5b2b;
  color:#fff;
  text-decoration:none;
  text-align:center;
  white-space:nowrap;
}

.btn.sub{
  background:#f1e7d8;
  color:#2b1b10;
  border:1px solid #d8c8b4;
}

.btn.gray{
  background:#555;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
}

.badge.wait{
  background:#fff3cd;
  color:#8a5a00;
}

.badge.done{
  background:#e8f5ee;
  color:#197857;
}

.badge.hold{
  background:#ffe2df;
  color:#a94438;
}

@media(max-width:900px){
  .filters{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:12px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <h1>점포별 정산 관리</h1>
    <p>월별·점포별 정산 내역과 지급상태를 조회하고 관리합니다.</p>
  </div>

  <div class="filters">
    <input
      id="keyword"
      placeholder="점포명 / 브랜드 / 지역 검색"
      onkeyup="applyFilter()">

    <input
      id="monthFilter"
      type="month"
      onchange="applyFilter()">

    <select id="statusFilter" onchange="applyFilter()">
  <option value="active" selected>
    진행중 정산
  </option>

  <option value="지급완료">
    지급완료 보관함
  </option>

  <option value="">
    전체 지급상태
  </option>

  <option value="미지급">
    미지급
  </option>

  <option value="보류">
    보류
  </option>
</select>
  </div>

  <div class="summary">
    <div class="box">
      <span>총매출</span>
      <strong id="totalSales">0</strong>
    </div>

    <div class="box">
      <span>공제금액 합계</span>
      <strong id="totalDeduction">0</strong>
    </div>

    <div class="box">
      <span>최종지급액</span>
      <strong id="totalPayment">0</strong>
    </div>

    <div class="box">
      <span>정산건수</span>
      <strong id="totalCount">0</strong>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>정산월</th>
          <th>브랜드</th>
          <th>점포명</th>
          <th>지급상태</th>
          <th>상권</th>
          <th>지역</th>
          <th>총매출</th>
          <th>백화점수수료</th>
          <th>전기료 등</th>
          <th>백화점소계</th>
          <th>본사관리비</th>
          <th>로열티</th>
          <th>관리/로열티 소계</th>
          <th>원재료비</th>
          <th>경비공과금</th>
          <th>공제합계</th>
          <th>최종지급액</th>
          <th>지급일</th>
          <th>정산서</th>
        </tr>
      </thead>

      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwg42OHYPkw8nv1X9vbuRNntXdw5isaVfXEEBzz_ya2W9uhTDTDEh4H4EnyFf2UfScXnw/exec";

let ALL_LIST = [];

window.addEventListener("load", loadSettlements);

async function loadSettlements(){

  try{

    const res =
      await fetch(
        API_URL +
        "?action=listSettlements&t=" +
        Date.now()
      );

    const data =
      await res.json();

    ALL_LIST =
  data.list || [];

applyFilter();

  }catch(e){

    alert("정산자료 조회 실패");

  }
}

function applyFilter(){

  const keyword =
    document.getElementById("keyword").value.trim();

  const month =
    document.getElementById("monthFilter").value;

  const status =
    document.getElementById("statusFilter").value;

  let list =
    [...ALL_LIST];

  if(keyword){

    list =
      list.filter(item => {

        const text = [
          item.brand,
          item.storeName,
          item.market,
          item.region,
          item.memo,
          item.paymentStatus
        ].join(" ");

        return text.indexOf(keyword) > -1;

      });
  }

  if(month){
    list =
      list.filter(item => item.month === month);
  }

  if(status === "active"){

  list = list.filter(item =>
    item.paymentStatus !== "지급완료"
  );

}else if(status){

  list = list.filter(item =>
    item.paymentStatus === status
  );

}

  render(list);
}

function render(list){

  setSummary(list);

  const tbody =
    document.getElementById("tbody");

  if(!list.length){

    tbody.innerHTML =
      `<tr>
        <td colspan="19" style="text-align:center;padding:40px;">
          정산자료가 없습니다.
        </td>
      </tr>`;

    return;
  }

  tbody.innerHTML =
    list.map(item => {

      return `
      <tr>
        <td class="left">${item.month || ""}</td>

        <td class="left">${safe(item.brand)}</td>

        <td class="left">
          <strong>${safe(item.storeName)}</strong>
        </td>

        <td class="left">
          <div class="status-box">
            <select id="status_${item.id}">
              <option ${selected(item.paymentStatus,"미지급")}>미지급</option>
              <option ${selected(item.paymentStatus,"지급완료")}>지급완료</option>
              <option ${selected(item.paymentStatus,"보류")}>보류</option>
            </select>

            <button
              class="btn"
              onclick="updateStatus('${item.id}')">
              변경
            </button>
          </div>

          <br>
          ${statusBadge(item.paymentStatus)}
        </td>

        <td class="left">${safe(item.market)}</td>
        <td class="left">${safe(item.region)}</td>

        <td>${money(item.sales)}</td>

        <td>${money(item.commissionAmount)}</td>

        <td>${money(item.utilityCost)}</td>

        <td>
          <strong>${money(item.departmentSubtotal)}</strong>
        </td>

        <td>${money(item.hqFeeAmount)}</td>

        <td>${money(item.royaltyAmount)}</td>

        <td>
          <strong>${money(item.royaltySubtotal)}</strong>
        </td>

        <td>
          <strong>${money(item.foodSubtotal)}</strong>
        </td>

        <td>
          <strong>${money(item.expenseSubtotal)}</strong>
        </td>

        <td>
          <strong>${money(item.totalDeduction)}</strong>
        </td>

        <td>
          <strong>${money(item.paymentAmount)}</strong>
        </td>

        <td class="left">
          <input
            id="date_${item.id}"
            type="date"
            value="${item.paymentDate || ""}">
        </td>

        <td class="left">
          <a
            class="btn sub"
            href="settlement-print.html?id=${encodeURIComponent(item.id)}"
            target="_blank">
            정산서
          </a>
        </td>
      </tr>
      `;

    }).join("");
}

function selected(a,b){
  return a === b ? "selected" : "";
}

function setSummary(list){

  let sales = 0;
  let deduction = 0;
  let payment = 0;

  list.forEach(item => {
    sales += Number(item.sales || 0);
    deduction += Number(item.totalDeduction || 0);
    payment += Number(item.paymentAmount || 0);
  });

  document.getElementById("totalSales").textContent =
    money(sales);

  document.getElementById("totalDeduction").textContent =
    money(deduction);

  document.getElementById("totalPayment").textContent =
    money(payment);

  document.getElementById("totalCount").textContent =
    list.length;
}

function statusBadge(status){

  if(status === "지급완료"){
    return `<span class="badge done">지급완료</span>`;
  }

  if(status === "보류"){
    return `<span class="badge hold">보류</span>`;
  }

  return `<span class="badge wait">미지급</span>`;
}

async function updateStatus(id){

  const status =
    document.getElementById(
      "status_" + id
    ).value;

  const paymentDate =
    document.getElementById(
      "date_" + id
    ).value;

  if(!confirm("지급상태를 '" + status + "'(으)로 변경할까요?")){
    return;
  }

  try{

    const res =
      await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
          action:"updatePaymentStatus",
          id:id,
          paymentStatus:status,
          paymentDate:paymentDate
        })
      });

    const data =
      await res.json();

    if(data.success){

      alert("지급상태가 변경되었습니다.");

      loadSettlements();

    }else{

      alert(data.message || "변경 실패");

    }

  }catch(e){

    alert("변경 중 오류가 발생했습니다.");

  }
}

function money(value){
  return Math.round(
    Number(value || 0)
  ).toLocaleString("ko-KR");
}

function safe(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
</script>

</body>
</html>
